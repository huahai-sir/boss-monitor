name: Boss Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wecom-cli
        run: npm install -g @wecom/cli
      - name: Setup credentials
        run: |
          mkdir -p ~/.config/wecom
          echo "${{ secrets.WECOM_KEY }}" > ~/.config/wecom/.encryption_key
          echo "${{ secrets.WECOM_CRED }}" | base64 -d > ~/.config/wecom/credentials.enc
          chmod 600 ~/.config/wecom/.encryption_key ~/.config/wecom/credentials.enc
      - name: Run monitor
        env:
          WECHAT_CHAT_ID: ${{ secrets.WECHAT_CHAT_ID }}
        run: python3 boss_monitor.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
